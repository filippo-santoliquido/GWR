# Training settings for the toy model.

# ---------------------------------------------------------------------------
# Data: detectors, extrinsic parameters, and what the network must learn.
# ---------------------------------------------------------------------------
data:
  waveform_dataset_path: training_data/waveform_dataset.hdf5
  train_fraction: 0.95       # 95% of the waveforms for training, 5% for testing
  detectors: [H1, L1, V1]    # LIGO Hanford, LIGO Livingston and Virgo
  # Priors of the extrinsic parameters. These are drawn at random during training.
  # Here only the luminosity distance is free; the others are fixed.
  extrinsic_prior:
    luminosity_distance: bilby.core.prior.Uniform(minimum=1000.0, maximum=3000.0)
    dec: 0.3
    ra: 1.0
    psi: 0.5
    geocent_time: 0.0
  ref_time: 1126259462.391   # GPS time that fixes the orientation of the Earth
  # Parameters that the network learns to infer.
  inference_parameters: [chirp_mass, luminosity_distance]

# ---------------------------------------------------------------------------
# Model: the neural networks.
# ---------------------------------------------------------------------------
model:
  posterior_model_type: normalizing_flow
  # The normalizing flow
  posterior_kwargs:
    num_flow_steps: 5
    base_transform_kwargs:
      hidden_dim: 64
      num_transform_blocks: 5
      activation: elu
      dropout_probability: 0.0
      norm: BatchNorm
      num_bins: 8
      base_transform_type: rq-coupling
  # The embedding network, which compresses the data
  embedding_type: resnet
  embedding_kwargs:
    output_dim: 32                    # size of the summary of the data
    hidden_dims: [256, 128, 64, 32]   # sizes of the residual blocks
    activation: elu
    dropout: 0.0
    norm: BatchNorm
    # SVD basis used to project the data before the embedding network
    svd:
      size: 50
      num_training_samples: 2000
      num_validation_samples: 200

# ---------------------------------------------------------------------------
# Training: optimization settings.
# ---------------------------------------------------------------------------
training:
  stage_0:
    epochs: 30
    asd_dataset_path: training_data/asd_dataset.hdf5
    freeze_rb_layer: True      # keep the SVD projection fixed
    optimizer:
      type: adam
      lr: 0.001               # initial learning rate
    scheduler:
      type: cosine             # decrease the learning rate along a cosine curve
      T_max: 30
    batch_size: 128

# ---------------------------------------------------------------------------
# Local: settings of this computer.
# ---------------------------------------------------------------------------
local:
  device: cpu                  # train on the CPU; no GPU is needed
  num_workers: 0
  runtime_limits:
    max_time_per_run: 3600000
    max_epochs_per_run: 30
  checkpoint_epochs: 10
